<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prepare Me</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .output { font-family: monospace; font-size: 13px; white-space: pre-wrap; min-height: 80px; max-height: 320px; overflow-y: auto; }
    .output a { color: #0d6efd; text-decoration: underline; cursor: pointer; }
    .settings-area { font-family: monospace; font-size: 13px; }
    .spinner-border { width: 1rem; height: 1rem; border-width: 0.15em; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 960px">
  <h2 class="mb-4 fw-bold">Prepare Me</h2>

  <!-- ── Run Phase ───────────────────────────────────────────── -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header fw-semibold">Run Phase</div>
    <div class="card-body">
      <div class="mb-3 d-flex align-items-center gap-3">
        <label class="form-label mb-0 fw-medium">Date</label>
        <input type="date" id="phaseDate" class="form-control w-auto">
      </div>
      <div class="d-flex gap-2 mb-3 flex-wrap">
        <button id="btn-draft"  class="btn btn-primary" onclick="runPhase('draft-plan',   this)">Draft Plan</button>
        <button id="btn-agenda" class="btn btn-primary" onclick="runPhase('create-agenda', this)">Create Agenda</button>
        <button id="btn-notes"  class="btn btn-primary" onclick="runPhase('save-notes',    this)">Save Notes</button>
      </div>
      <div id="phaseStatus" class="text-muted small mb-1"></div>
      <div id="phaseOutput" class="output p-2 bg-white border rounded"></div>
    </div>
  </div>

  <!-- ── Settings ────────────────────────────────────────────── -->
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Excluded Events</div>
        <div class="card-body d-flex flex-column">
          <p class="text-muted small mb-2">
            One calendar event title per line.<br>
            These are skipped during <strong>Draft Plan</strong>.
          </p>
          <textarea id="excludedEvents" class="form-control settings-area flex-grow-1 mb-2" rows="12"
                    placeholder="Loading…"></textarea>
          <button class="btn btn-success btn-sm" onclick="saveExcludedEvents()">Save Excluded Events</button>
          <div id="excludedMsg" class="mt-2 small"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Doc Mappings</div>
        <div class="card-body d-flex flex-column">
          <p class="text-muted small mb-2">
            One mapping per line: <code>Meeting Title = Drive Path</code><br>
            Used by <strong>Create Agenda</strong> for group meetings.
            1-1 meetings matching <em>Name / Dmitry</em> are auto-resolved.
          </p>
          <textarea id="docMappings" class="form-control settings-area flex-grow-1 mb-2" rows="12"
                    placeholder="Loading…"></textarea>
          <button class="btn btn-success btn-sm" onclick="saveDocMappings()">Save Doc Mappings</button>
          <div id="mappingsMsg" class="mt-2 small"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Init ──────────────────────────────────────────────────────
  const todayIso = new Date().toISOString().split('T')[0];
  document.getElementById('phaseDate').value = todayIso;

  // ── Phase execution ───────────────────────────────────────────
  async function runPhase(phase, btn) {
    const date   = document.getElementById('phaseDate').value || todayIso;
    const output = document.getElementById('phaseOutput');
    const status = document.getElementById('phaseStatus');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border me-1"></span>' + btn.textContent.trim();
    status.textContent = 'Running ' + phase + ' for ' + date + '…';
    output.textContent = '';

    try {
      const res  = await fetch('/api/phases/' + phase + '?date=' + date, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        status.textContent = 'Failed.';
        output.textContent = 'Error: ' + (data.error || res.statusText);
        output.className = 'output p-2 bg-white border border-danger rounded text-danger';
      } else {
        status.textContent = 'Done.';
        output.innerHTML = formatResult(phase, data);
        output.className = 'output p-2 bg-white border rounded';
      }
    } catch (e) {
      status.textContent = 'Failed.';
      output.textContent = 'Error: ' + e.message;
      output.className = 'output p-2 bg-white border border-danger rounded text-danger';
    } finally {
      btn.disabled = false;
      btn.innerHTML = btn.textContent.trim();  // strip spinner
      btn.textContent = labelFor(phase);
    }
  }

  function labelFor(phase) {
    return { 'draft-plan': 'Draft Plan', 'create-agenda': 'Create Agenda', 'save-notes': 'Save Notes' }[phase] || phase;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatResult(phase, data) {
    if (phase === 'draft-plan') {
      const cards = data.cards || [];
      return cards.length === 0
        ? 'No cards created.'
        : 'Created ' + cards.length + ' card(s):\n' + cards.map(c => '  • ' + esc(c)).join('\n');
    }
    if (phase === 'create-agenda') {
      const entries = Object.entries(data);
      if (entries.length === 0) return 'No agendas created.';
      return 'Agendas written (' + entries.length + '):\n'
        + entries.map(([k, v]) => '  • ' + esc(k) + '\n    <a href="' + esc(v) + '" target="_blank">' + esc(v) + '</a>').join('\n');
    }
    if (phase === 'save-notes') {
      const entries = Object.entries(data);
      return entries.length === 0
        ? 'No notes saved.'
        : 'Notes saved:\n' + entries.map(([k, v]) => '  • ' + esc(k) + ': ' + esc(v) + ' comment(s)').join('\n');
    }
    return esc(JSON.stringify(data, null, 2));
  }

  // ── Settings load ─────────────────────────────────────────────
  async function loadSettings() {
    try {
      const [evRes, mapRes] = await Promise.all([
        fetch('/api/settings/excluded-events'),
        fetch('/api/settings/doc-mappings')
      ]);
      const events   = await evRes.json();
      const mappings = await mapRes.json();
      document.getElementById('excludedEvents').value = events.join('\n');
      document.getElementById('docMappings').value =
        Object.entries(mappings).map(([k, v]) => k + ' = ' + v).join('\n');
    } catch (e) {
      console.error('Failed to load settings', e);
    }
  }

  // ── Settings save ─────────────────────────────────────────────
  async function saveExcludedEvents() {
    const lines = document.getElementById('excludedEvents').value
      .split('\n').map(l => l.trim()).filter(Boolean);
    const res = await fetch('/api/settings/excluded-events', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(lines)
    });
    showMsg('excludedMsg', res.ok, res.ok ? 'Saved.' : 'Save failed.');
  }

  async function saveDocMappings() {
    const lines = document.getElementById('docMappings').value
      .split('\n').map(l => l.trim()).filter(Boolean);
    const mappings = {};
    for (const line of lines) {
      const idx = line.indexOf(' = ');
      if (idx > 0) mappings[line.substring(0, idx).trim()] = line.substring(idx + 3).trim();
    }
    const res = await fetch('/api/settings/doc-mappings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mappings)
    });
    showMsg('mappingsMsg', res.ok, res.ok ? 'Saved.' : 'Save failed.');
  }

  function showMsg(id, ok, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'mt-2 small ' + (ok ? 'text-success' : 'text-danger');
    setTimeout(() => { el.textContent = ''; }, 3000);
  }

  loadSettings();
</script>
</body>
</html>
